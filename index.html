<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f7f5" id="themeColorMeta" />
    <title>Optenix EMS Pro – Secure Portal</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon"
    href="https://res.cloudinary.com/dowhvdkjh/image/upload/v1784705930/Screenshot_20260715_131553_Gallery_2_bssa0e.jpg" />
    <link rel="icon" type="image/jpeg"
    href="https://res.cloudinary.com/dowhvdkjh/image/upload/v1784705930/Screenshot_20260715_131553_Gallery_2_bssa0e.jpg" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- ADDED FIREBASE MESSAGING -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Google Fonts -->
    <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

    <style>
        /* ----- MATERIAL INSPIRED CSS ----- */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;

            /* Light Theme */
            --light: #f7f7f5;
            --white: #ffffff;
            --dark: #1a1a1a;
            --gray-50: #fcfcfc;
            --gray-100: #f0f0f0;
            --gray-200: #e2e2e2;
            --gray-300: #d1d1d1;
            --gray-400: #a3a3a3;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-800: #262626;
            --gray-900: #171717;
            --border: #e5e5e5;

            /* Elevations */
            --elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.1), 0px 1px 2px 0px rgba(0, 0, 0, 0.06);
            --elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.1), 0px 1px 2px 0px rgba(0, 0, 0, 0.06);
            --elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.1), 0px 1px 3px 0px rgba(0, 0, 0, 0.06);

            --radius-sm: 6px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dark Theme */
        .dark-mode {
            --light: #121212;
            --white: #1e1e1e;
            --dark: #f5f5f5;
            --gray-50: #242424;
            --gray-100: #2a2a2a;
            --gray-200: #333333;
            --gray-300: #404040;
            --gray-400: #525252;
            --gray-500: #737373;
            --gray-600: #a3a3a3;
            --gray-700: #d1d1d1;
            --border: #333333;
            --elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.5), 0px 1px 2px 0px rgba(0, 0, 0, 0.6);
            --elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.5), 0px 1px 2px 0px rgba(0, 0, 0, 0.6);
            --elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.5), 0px 1px 3px 0px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Inter', sans-serif;
            background: var(--light);
            color: var(--dark);
            transition: var(--transition);
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        input,
        textarea,
        select {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        .blur-screen {
            filter: blur(20px) grayscale(100%);
            pointer-events: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--light);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-400);
            border-radius: 10px;
        }

        .logo-dark {
            display: none;
        }

        .logo-light {
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.25));
        }

        .dark-mode .logo-dark {
            display: block;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.8));
        }

        .dark-mode .logo-light {
            display: none;
        }

        /* ===== LOADING OVERLAY ===== */
        #appLoadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #appLoadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-spinner {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-brand {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .loader-brand span {
            color: var(--primary);
        }

        .loader-sub {
            font-size: 13px;
            color: var(--gray-500);
            font-weight: 400;
        }

        .loader-progress-bar {
            width: 200px;
            height: 3px;
            background: var(--gray-200);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loader-progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            animation: progressFill 2.2s ease-in-out forwards;
        }

        @keyframes progressFill {
            0% {
                width: 0%;
            }
            40% {
                width: 40%;
            }
            70% {
                width: 75%;
            }
            100% {
                width: 100%;
            }
        }

        /* ===== SKELETON LOADERS ===== */
        .skeleton {
            background: var(--gray-200);
            border-radius: var(--radius-sm);
            animation: shimmer 1.5s ease-in-out infinite;
            background-image: linear-gradient(90deg, var(--gray-200) 0%, var(--gray-300) 50%, var(--gray-200) 100%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .skeleton-text {
            height: 14px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .skeleton-text.w-60 {
            width: 60%;
        }
        .skeleton-text.w-40 {
            width: 40%;
        }
        .skeleton-text.w-80 {
            width: 80%;
        }

        .skeleton-card {
            padding: 20px;
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .skeleton-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light);
            position: relative;
            overflow: hidden;
        }

        .login-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--elevation-3);
            animation: slideUp 0.5s ease;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-header img {
            max-width: 180px;
            height: auto;
            margin-bottom: 16px;
            display: block;
        }

        .login-header p {
            color: var(--gray-500);
            font-size: 14px;
            font-weight: 500;
        }

        .inline-error {
            color: var(--danger);
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--gray-600);
        }

        .form-input {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            padding: 12px 14px;
            background-color: var(--gray-50);
            border: 1px solid var(--gray-300);
            border-bottom: 2px solid var(--gray-400);
            border-radius: 4px 4px 0 0;
            font-size: 15px;
            font-family: inherit;
            color: var(--dark);
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gray-300);
            border-bottom-color: var(--primary);
            background-color: var(--white);
            box-shadow: 0 4px 6px -4px rgba(99, 102, 241, 0.2);
        }

        /* ----- DARK MODE FIXES for form inputs ----- */
        .dark-mode .form-input {
            background-color: #2a2a2a;
            color: #f0f0f0;
            border-color: #444;
            border-bottom-color: #555;
        }

        .dark-mode .form-input:focus {
            background-color: #333;
            border-color: #555;
            border-bottom-color: var(--primary);
            box-shadow: 0 4px 6px -4px rgba(99, 102, 241, 0.3);
        }

        .dark-mode .form-input::placeholder {
            color: #888;
        }

        .dark-mode .form-group label {
            color: #b0b0b0;
        }

        .dark-mode .login-card {
            background: #1e1e1e;
            border-color: #333;
        }

        .dark-mode .login-header p {
            color: #999;
        }

        .dark-mode .text-muted {
            color: #888;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--elevation-1);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: var(--elevation-2);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: rgba(99, 102, 241, 0.08);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-xs {
            padding: 4px 8px;
            font-size: 11px;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: var(--elevation-1);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: var(--elevation-1);
        }

        .btn-ghost {
            background: transparent;
            color: var(--gray-600);
            position: relative;
        }

        .btn-ghost:hover {
            background: var(--gray-100);
        }

        .btn-block {
            width: 100%;
            padding: 12px;
        }

        /* Dashboard Layout */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--white);
            color: var(--dark);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: var(--transition);
            z-index: 100;
            box-shadow: var(--elevation-2);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .sidebar-header {
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header img {
            max-width: 140px;
            height: auto;
        }

        .sidebar-menu {
            list-style: none;
            padding: 12px;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 4px;
        }

        .sidebar-menu a {
            color: var(--gray-700);
            text-decoration: none;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-menu a:hover {
            background: var(--gray-100);
        }

        .sidebar-menu a.active {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-dark);
        }

        .sidebar-menu a.active i {
            color: var(--primary);
        }

        .sidebar-menu a i {
            width: 20px;
            font-size: 18px;
            color: var(--gray-500);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 24px;
            transition: var(--transition);
            min-height: 100vh;
        }

        .top-bar {
            background: var(--white);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--elevation-1);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .top-bar h2 {
            font-weight: 500;
            font-size: 22px;
            color: var(--dark);
        }

        .top-bar-actions {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        #notificationCount {
            position: absolute;
            top: -2px;
            right: -2px;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--elevation-1);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .stat-card:hover {
            box-shadow: var(--elevation-2);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .stat-label {
            color: var(--gray-500);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-sub {
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 4px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--elevation-1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h3 {
            font-weight: 500;
            font-size: 18px;
            color: var(--dark);
        }

        .responsive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .material-item-card {
            background: var(--gray-50);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--elevation-3);
            border: 1px solid var(--border);
        }

        /* Custom Confirm Modal */
        #confirmModal {
            z-index: 3000;
        }

        #confirmModal .modal-content {
            max-width: 360px;
            text-align: center;
            padding: 32px 24px;
        }

        .confirm-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        /* ===== CHAT STYLES — MOBILE FIRST ===== */
        .chat-container {
            display: flex;
            height: calc(100vh - 160px);
            min-height: 400px;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--elevation-1);
            position: relative;
            border: 1px solid var(--border);
        }

        .chat-sidebar {
            width: 300px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: var(--white);
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            position: relative;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 14px 16px;
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-item:hover,
        .chat-item.active {
            background: var(--gray-50);
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 16px;
            flex-shrink: 0;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--light);
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--white);
            flex-shrink: 0;
            min-height: 60px;
        }

        .chat-mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--dark);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .chat-mobile-toggle:hover {
            background: var(--gray-100);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--light);
            min-height: 0;
        }

        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            animation: messageIn 0.3s ease;
            word-wrap: break-word;
            font-size: 14px;
            box-shadow: var(--elevation-1);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: var(--white);
            color: var(--dark);
            align-self: flex-start;

    // ============================================================

    function linkify(text) {
        if (!text || typeof text !== 'string') return text;
        const urlPattern = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(?:\/[^\s<>"']*)?)/g;
        return text.replace(urlPattern, function(url) {
            let trimmedUrl = url;
            const trailingPunct = /[.,;:!?)]$/.exec(url);
            if (trailingPunct) trimmedUrl = url.slice(0, -1);
            let href = trimmedUrl;
            if (!href.startsWith('http://') && !href.startsWith('https://')) href = 'https://' + href;
            const displayText = trimmedUrl;
            const punct = trailingPunct ? trailingPunct[0] : '';
            return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="chat-link">${displayText}</a>${punct}`;
        });
    }

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function formatBytes(bytes) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
    }

    async function handleLogin() {
        clearLoginErrors();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        if (!email) { showLoginError('email', 'Email is required');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SIGN IN'; return; }
        if (!password) { showLoginError('pass', 'Password is required');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SIGN IN'; return; }

        try {
            const cred = await auth.signInWithEmailAndPassword(email, password);
            const uid = cred.user.uid;
            let emp = null;

            const userDoc = await db.collection('user').doc(uid).get();
            if (userDoc.exists) emp = userDoc.data();
            else {
                const empSnap = await employeesRef.where('uid', '==', uid).get();
                if (!empSnap.empty) emp = empSnap.docs[0].data();
            }

            if (!emp) { await auth.signOut();
                showModalError('Access Denied', 'User profile not found in the database.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SIGN IN'; return; }

            if (emp.ipLock === 'true' || emp.ipLock === true) {
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const userIp = (await ipRes.json()).ip;
                    const setDoc = await db.collection('settings').doc('security').get();
                    const officeIp = setDoc.exists ? setDoc.data().officeIP : '';
                    if (officeIp && userIp !== officeIp) {
                        await auth.signOut();
                        showModalError('Access Denied',
                            'You must be connected to the authorized Office Network to log in.');
                        db.collection('notifications').add({
                            id: Date.now().toString(),
                            message: `Security Block: ${emp.name} attempted login from unauthorized IP (${userIp}).`,
                            targetId: 'admin',
                            timestamp: new Date().toISOString(),
                            type: 'security'
                        });
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SIGN IN';
                        return;
                    }
                } catch (err) {
                    await auth.signOut();
                    showToast('Failed to verify secure network connection.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SIGN IN';
                    return;
                }
            }
            setCurrentUser(emp, uid);
        } catch (err) {
            showModalError('Login Failed', 'Invalid credentials or account locked.');
        }
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SIGN IN';
    }

    async function getRecentActivities() {
        try {
            const snap = await dailyReportsRef.orderBy('submittedAt', 'desc').limit(5).get();
            const reports = snap.docs.map(d => d.data());
            window._recentReports = reports;

            if (reports.length === 0) {
                return '<p class="text-muted">No activity</p>';
            }

            return reports.map((r, idx) => {
                const employeeName = r.employeeName || 'Unknown';
                const date = r.date || 'Unknown date';
                const preview = r.completedWork && Array.isArray(r.completedWork) ?
                    r.completedWork.slice(0, 2).join(', ') + (r.completedWork.length > 2 ? '…' : '') :
                    'View report details';
                const hasExcel = r.excelFileUrl ? true : false;
                return `
                            <div class="activity-item" onclick="viewReportDetails(${idx})" title="Click to view full report">
                                <strong>${employeeName}</strong> submitted report
                                ${hasExcel ? '<span class="badge badge-excel" style="font-size:9px;margin-left:6px;"><i class="fas fa-file-excel"></i> Excel</span>' : ''}
                                <div style="font-size:13px; color:var(--gray-600); margin-top:2px;">${preview}</div>
                                <div class="activity-date">${date}</div>
                            </div>
                        `;
            }).join('');
        } catch (e) {
            console.error('Error fetching recent activities:', e);
            return '<p class="text-muted">Unable to load activities</p>';
        }
    }

    function viewReportDetails(index) {
        const reports = window._recentReports || [];
        const r = reports[index];
        if (!r) {
            showToast('Report not found', 'error');
            return;
        }

        const buildList = (data, fallback) => {
            if (Array.isArray(data) && data.length > 0) {
                return `<ul style="padding-left:20px; margin:8px 0 0;">${data.map(i => `<li style="margin-bottom:4px;">${i}</li>`).join('')}</ul>`;
            }
            if (typeof data === 'string' && data.trim() !== '') {
                return `<p style="margin:8px 0 0; font-size:14px;">${data}</p>`;
            }
            return `<p style="margin:8px 0 0; color:var(--gray-500); font-size:13px;">${fallback}</p>`;
        };

        const completed = r.completedWork || r.todayWork || [];
        const planned = r.plannedWork || [];
        const challenges = r.challenges || [];
        const excelUrl = r.excelFileUrl || null;

        showConfirmModal('Save Changes', 'Are you sure you want to update this employee profile?', async () => {
            const name = document.getElementById('editEmpName').value.trim();
            const department = document.getElementById('editEmpDept').value;
            const designation = document.getElementById('editEmpDesignation').value.trim();
            const ipLock = document.getElementById('editEmpIpLock').value;
            const email = document.getElementById('editEmpEmail').value.trim();
            const newPassword = document.getElementById('editEmpPassword').value.trim();

            let updatePayload = { name, department, designation, ipLock, email };

            if (newPassword) {
                if (newPassword.length < 6) { showToast('Password must be min 6 characters', 'error'); return; }

            await employeesRef.doc(id).update(updatePayload);
            closeModal();
            loadEmployees();
            showToast('Employee details updated in database.', 'warning');
        });
    }

    // ============================================================
    //  EXCEL UPLOAD HANDLERS
    // ============================================================
    function setupExcelDropZone() {
        const dropArea = document.getElementById('excelDropArea');
        if (!dropArea) return;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                dropArea.closest('.excel-upload-section').classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                dropArea.closest('.excel-upload-section').classList.remove('dragover');
            }, false);
        });

        dropArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleExcelFile(files[0]);
            }
        }, false);
    }

    function handleExcelFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            handleExcelFile(file);
        }
        event.target.value = '';
    }

    function handleExcelFile(file) {
        // Validate file type
        const validTypes = [
            'application/vnd.ms-excel',
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
            'text/csv',
            'application/vnd.oasis.opendocument.spreadsheet'
        ];
        const ext = file.name.split('.').pop().toLowerCase();
        const validExts = ['xlsx', 'xls', 'csv', 'ods'];

        if (!validTypes.includes(file.type) && !validExts.includes(ext)) {
            showToast('Please upload an Excel file (.xlsx, .xls, .csv, .ods)', 'error');
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            showToast('File size must be less than 10MB', 'error');
            return;
        }

        excelFileData = {
            file: file,
            name: file.name,
            size: formatBytes(file.size),
            type: file.type,
            uploaded: false,
            url: null
        };

        // Show preview
        document.getElementById('excelFileName').textContent = file.name;
        document.getElementById('excelFileSize').textContent = formatBytes(file.size);
        document.getElementById('excelFilePreview').style.display = 'flex';
        document.querySelector('#excelUploadSection .upload-area').style.display = 'none';

        // Auto-upload to Cloudinary
        uploadExcelToCloudinary(file);
    }

    function removeExcelFile() {
        excelFileData = null;
        document.getElementById('excelFilePreview').style.display = 'none';
        document.querySelector('#excelUploadSection .upload-area').style.display = 'flex';
        document.getElementById('excelUploadProgress').style.display = 'none';
        document.getElementById('excelProgressFill').style.width = '0%';
    }

    function uploadExcelToCloudinary(file) {
        const progressContainer = document.getElementById('excelUploadProgress');
        const progressFill = document.getElementById('excelProgressFill');
        const progressText = document.getElementById('excelProgressText');

        progressContainer.style.display = 'block';
        progressFill.style.width = '0%';
        progressText.textContent = 'Uploading… 0%';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, true);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const pct = Math.round((e.loaded / e.total) * 100);
                progressFill.style.width = pct + '%';
                progressText.textContent = `Uploading… ${pct}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);
                excelFileData.url = data.secure_url;
                excelFileData.uploaded = true;
                progressText.textContent = '✅ Upload complete!';
                progressFill.style.width = '100%';
                showToast('Excel file uploaded successfully!', 'success');

                // Update preview with checkmark
                const fileInfo = document.querySelector('#excelFilePreview .file-info');
                const existingIcon = fileInfo.querySelector('i');
                if (existingIcon) {
                    existingIcon.className = 'fas fa-check-circle';
                    existingIcon.style.color = 'var(--success)';
                }
            } else {
                console.error('Upload failed:', xhr.responseText);
                progressText.textContent = '❌ Upload failed. Please try again.';
                showToast('Failed to upload Excel file. Please try again.', 'error');
                // Keep the file selected but mark as not uploaded
                excelFileData.uploaded = false;
                excelFileData.url = null;
            }
        };

        xhr.onerror = () => {
            progressText.textContent = '❌ Network error. Please try again.';
            showToast('Network error during upload.', 'error');
            excelFileData.uploaded = false;
            excelFileData.url = null;
        };

        xhr.send(formData);
    }

    async function submitDailyReport() {
        const date = document.getElementById('reportDate').value;
        const compArr = Array.from(document.querySelectorAll('.comp-val')).map(i => i.value.trim()).filter(v => v);
        const planArr = Array.from(document.querySelectorAll('.plan-val')).map(i => i.value.trim()).filter(v => v);
        const chalArr = Array.from(document.querySelectorAll('.chal-val')).map(i => i.value.trim()).filter(v => v);

        if (!date || compArr.length === 0) { showModalError('Missing Data',
                'Date and at least one Completed Work item are required.'); return; }

        const payload = {
            employeeId: currentUser.employeeId,
            employeeName: currentUser.name,
            department: currentUser.department,
            date,
            completedWork: compArr,
            plannedWork: planArr,
            challenges: chalArr,
            submittedAt: new Date().toISOString()
        };

        // Add Excel file data if present and uploaded
        if (excelFileData && excelFileData.uploaded && excelFileData.url) {
            payload.excelFileUrl = excelFileData.url;
            payload.excelFileName = excelFileData.name;
            payload.excelFileSize = excelFileData.size;
        } else if (excelFileData && !excelFileData.uploaded) {
            showToast('Please wait for the Excel file to finish uploading, or remove it.', 'warning');
            return;
        }

        await dailyReportsRef.add(payload);
        addNotification(`Daily report submitted successfully!`, currentUser.employeeId);
        showToast('Report submitted!', 'success');
        loadDailyReport();
    }

    function openChat(chatId, chatName) {
        activeChat = chatId;
        document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
        const items = document.querySelectorAll('.chat-item');
        for (let item of items) {
            const onclick = item.getAttribute('onclick');
            if (onclick && onclick.includes(`'${chatId}'`)) {
                item.classList.add('active');
                break;
            }
        }
        document.getElementById('chatName').textContent = chatName;
        closeChatSidebar();

        chatsRef.doc(chatId).onSnapshot(doc => {
            if (activeChat === chatId) {
                const messages = doc.exists ? (doc.data().messages || []) : [];
                renderMessageList(messages);
                if (messages.length > 0) {
                    const lastMsg = messages[messages.length - 1];
                    const msgTime = new Date(lastMsg.timestamp).getTime();
                    if (msgTime > appLoadTime && lastMsg.sender !== currentUser.name) {
                        const chatDisplayName = chatName || 'Chat';
                        addNotification(`💬 New message from ${lastMsg.sender} in ${chatDisplayName}`, currentUser.employeeId, 'chat');
                        sendNativeNotification(`💬 New message from ${lastMsg.sender}`, lastMsg.text || 'Sent an attachment');
                    }
                }
            }
        });
    }

    function renderMessageList(msgs) {
        const c = document.getElementById('chatMessages');
        if (!c) return;
        const tempProgress = document.getElementById('tempUploadProgress');
        let tempHtml = tempProgress ? tempProgress.outerHTML : '';

        c.innerHTML = msgs.length === 0 ? '<p class="text-center text-muted mt-4">No messages yet</p>' :
            msgs.map(m => {
                let attachmentHtml = '';
                if (m.fileUrl) {
                    const isImg = (m.fileType && m.fileType.startsWith('image/')) || (m.fileUrl.match(
                        /\.(jpeg|jpg|gif|png|webp|bmp)$/i));
                    const sizeBadge = m.fileSize ? `<span class="file-size-badge">${m.fileSize}</span>` :
                        '';
                    if (isImg) {
                        attachmentHtml = `<div style="margin-top:8px;">
                                        <a href="${m.fileUrl}" target="_blank"><img src="${m.fileUrl}" class="chat-image-preview" alt="Attached Image"></a>
                                        <div style="font-size:11px; opacity:0.7; margin-top:4px;">${m.fileName || 'Image'} ${sizeBadge}</div>
                                    </div>`;
                    } else {
                        attachmentHtml = `<div style="margin-top:8px;">
                                        <a href="${m.fileUrl}" target="_blank" class="chat-file-link">
                                            <i class="fas fa-file-download"></i> ${m.fileName || 'Download File'} ${sizeBadge}
                                        </a>
                                    </div>`;
                    }
                }

                let adminDeleteBtn = '';
                const uid = m.msgId || m.timestamp;
                if (userRole === 'admin') {
                    adminDeleteBtn =
                        `<button class="msg-delete-btn" onclick="deleteChatMessage('${activeChat}', '${uid}')" title="Delete Message"><i class="fas fa-trash"></i></button>`;
                }

                const linkedText = m.text ? linkify(m.text) : '';

                return `<div class="message ${m.sender === currentUser.name ? 'sent' : 'received'}">
                                ${adminDeleteBtn}
                                ${m.sender !== currentUser.name ? `<strong style="font-size:11px; opacity:0.8;">${m.sender}</strong><br>` : ''}
                                ${linkedText ? `<div class="msg-text">${linkedText}</div>` : ''}
                                ${attachmentHtml}
                                <div class="message-time">${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                            </div>`;
            }).join('') + tempHtml;

        const shouldScroll = c.scrollHeight - c.scrollTop <= c.clientHeight + 150;
        if (shouldScroll) {
            setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
        }
    }

    // ============================================================
    //  SEND MESSAGE
    // ============================================================
    async function sendMessage(fileObj = null) {
        if (!activeChat) return;
        const textInput = document.getElementById('messageInput');
        const text = textInput ? textInput.value.trim() : '';

        const isFile = fileObj && fileObj.url ? true : false;
        if (!text && !isFile) return;

        const msgId = Date.now().toString() + Math.random().toString(36).substr(2, 5);

        const msg = {
            msgId: msgId,
            sender: currentUser.name,
            text: text,
            timestamp: new Date().toISOString()
        };

        if (isFile) {
            msg.fileUrl = fileObj.url;
            msg.fileName = fileObj.name;
            msg.fileType = fileObj.type;
            msg.fileSize = fileObj.size;
        }

        const docRef = chatsRef.doc(activeChat);
        const doc = await docRef.get();
        if (doc.exists) await docRef.update({ messages: firebase.firestore.FieldValue.arrayUnion(msg) });
        else await docRef.set({ messages: [msg] });

        if (textInput) {
            textInput.value = '';
            textInput.style.height = '40px';
        }

        const chatMessages = document.getElementById('chatMessages');
        if (chatMessages) {
            setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
        }

        const chatName = document.getElementById('chatName')?.textContent || 'Chat';
        await addChatNotification(activeChat, currentUser.name, text || '📎 Sent an attachment', chatName);
    }

    // ============================================================
    async function addChatNotification(chatId, senderName, messagePreview, chatDisplayName) {
        try {
            const senderId = currentUser.employeeId;

            if (chatId === 'org_global') {
                await addNotification(`💬 ${senderName} (Global): ${messagePreview}`, 'all', 'chat');
            } else if (chatId.startsWith('team_')) {
                const deptName = chatId.replace('team_', '');
                const empSnap = await employeesRef.where('department', '==', deptName).get();
                const empIds = empSnap.docs.map(d => d.data().id).filter(id => id !== senderId);

                for (const empId of empIds) {
                    await addNotification(`💬 ${senderName} in ${deptName} Team: ${messagePreview}`, empId, 'chat');
                }
                if (userRole !== 'admin') {
                    await addNotification(`💬 ${senderName} in ${deptName} Team: ${messagePreview}`, 'admin', 'chat');
                }
            } else if (chatId.startsWith('direct_admin_')) {
                const targetEmpId = chatId.replace('direct_admin_', '');
                const recipientId = (userRole === 'admin') ? targetEmpId : 'admin';
                await addNotification(`💬 ${senderName}: ${messagePreview}`, recipientId, 'chat');
            } else if (chatId.startsWith('direct_emp_')) {
                const parts = chatId.split('_');
                const id1 = parts[2];
                const id2 = parts[3];
                const recipientId = (id1 === senderId) ? id2 : id1;

                if (recipientId && recipientId !== senderId) {
                    await addNotification(`💬 ${senderName}: ${messagePreview}`, recipientId, 'chat');
                }
                if (userRole !== 'admin') {
                    await addNotification(`💬 ${senderName} → ${recipientId}: ${messagePreview}`, 'admin', 'chat');
                }
            }
        } catch (e) {
            console.error('Error adding chat notification:', e);
        }
    }

    function deleteChatMessage(chatId, msgId) {
        showConfirmModal('Delete Message', 'Admin: Permanently delete this message and file for everyone?',
            async () => {
                const docRef = chatsRef.doc(chatId);
                const doc = await docRef.get();
                if (doc.exists) {
                    const msgs = doc.data().messages || [];
                    const updatedMsgs = msgs.filter(m => m.msgId !== msgId && m.timestamp !== msgId);
                    await docRef.update({ messages: updatedMsgs });
                    showToast('Message deleted.', 'success');
                }
            });
    }

    async function handleChatFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const originalFileName = file.name;
        const formattedSize = formatBytes(file.size);

        const chatMessages = document.getElementById('chatMessages');
        const progressId = 'prog_' + Date.now();

        const progressHtml = `
                    <div id="tempUploadProgress" class="message sent" style="display:flex; align-items:center; gap:12px; opacity:0.8; margin-top:8px;">
                        <div class="circular-progress">
                            <svg viewBox="0 0 36 36">
                                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path id="${progressId}_circle" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                        </div>
                        <div>
                            <div style="font-weight:600; font-size:13px;">Uploading ${originalFileName.substring(0, 20)}...</div>
                            <div id="${progressId}_text" style="font-size:11px;">0% • Estimating time...</div>
                        </div>
                    </div>
                `;
        if (chatMessages) {
            chatMessages.insertAdjacentHTML('beforeend', progressHtml);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const startTime = Date.now();
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, true);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                const timeElapsed = (Date.now() - startTime) / 1000;
                const uploadSpeed = e.loaded / timeElapsed;
                const timeRemaining = (e.total - e.loaded) / uploadSpeed;

                let timeStr = '';
                if (timeRemaining > 60) {
                    timeStr = Math.round(timeRemaining / 60) + ' min left';
                } else if (timeRemaining > 0 && timeRemaining !== Infinity) {
                    timeStr = Math.round(timeRemaining) + ' sec left';
                } else {
                    timeStr = 'Finishing...';
                }

                const circle = document.getElementById(`${progressId}_circle`);
                if (circle) circle.setAttribute('stroke-dasharray', `${percentComplete}, 100`);

                const textNode = document.getElementById(`${progressId}_text`);
                if (textNode) textNode.textContent = `${percentComplete}% • ${timeStr}`;
            }
        };

        xhr.onload = async () => {
            const tempDiv = document.getElementById('tempUploadProgress');
            if (tempDiv) tempDiv.remove();

            if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);
                const safeUrl = data.secure_url;
                const safeType = file.type || `${data.resource_type}/${data.format}` || 'unknown';
                await sendMessage({ url: safeUrl, name: originalFileName, type: safeType, size: formattedSize });
            } else {
                console.error('File Upload Error:', xhr.responseText);
                showModalError('Upload Failed', 'Ensure your Upload Preset is correctly configured in Cloudinary.');
            }
            event.target.value = '';
        };

        xhr.onerror = () => {
            const tempDiv = document.getElementById('tempUploadProgress');
            if (tempDiv) tempDiv.remove();
            showModalError('Upload Failed', 'Network error occurred during file upload.');
            event.target.value = '';
        };

        xhr.send(formData);
    }

    async function changePassword() {
        const current = prompt('Current password:');
        if (!current) return;
        const newPass = prompt('New password (min 6 chars):');
        if (!newPass || newPass.length < 6) return;
        try {
            const user = auth.currentUser;
            await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,
                current));
            await user.updatePassword(newPass);
            const hashed = await sha256(newPass);
            const userDoc = await db.collection('user').doc(user.uid).get();
            if (userDoc.exists) await userDoc.ref.update({ password: hashed });
            const empSnap = await employeesRef.where('uid', '==', user.uid).get();
            if (!empSnap.empty) await empSnap.docs[0].ref.update({ password: hashed });
            showToast('Password updated!', 'success');
        } catch (err) { showModalError('Update Failed', 'Ensure current password is correct.'); }
    }

    async function loadNotifications() {
        const snap = await notificationsRef.get();
        let notifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (userRole === 'admin') notifs = notifs.filter(n => n.targetId === 'admin' || n.targetId === 'all');
        else notifs = notifs.filter(n => n.targetId === currentUser.employeeId || n.targetId === 'all');

        notifs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        notifs = notifs.slice(0, 30);

        let html = `
                    <div class="card" style="padding:0; overflow:hidden;">
                        <div class="card-header" style="padding: 24px; margin-bottom: 0; border-bottom: 1px solid var(--border);">
                            <h3 style="margin:0;">Notifications</h3>
                            ${notifs.length > 0 ? `<button class="btn btn-outline btn-xs" onclick="clearAllNotifications()"><i class="fas fa-trash-alt"></i> Clear All</button>` : ''}
                        </div>
                        <div class="notification-list-container" id="notifContainer">
                            ${notifs.length === 0 ? '<p class="text-center text-muted" style="padding:24px;">No notifications</p>' : notifs.map(n => `
                            <div class="notification-item" id="notif_${n.id}" data-id="${n.id}" style="${n.type === 'security' ? 'background:var(--gray-50); border-left:4px solid var(--danger);' : ''}">
                                <div class="notification-icon" style="background:${n.type === 'chat' ? 'var(--secondary)' : n.type === 'security' ? 'var(--danger)' : 'var(--primary)'};">
                                    <i class="fas fa-${n.type === 'chat' ? 'comment' : n.type === 'security' ? 'shield-alt' : 'bell'}"></i>
                                </div>
                                <div style="flex:1;">
                                    <p style="${n.type === 'security' ? 'color:var(--danger);font-weight:500;' : ''} margin-bottom:4px; font-size:14px;">${n.message}</p>
                                    <small class="text-muted">${new Date(n.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</small>
                                </div>
                                <button class="notif-delete-btn" onclick="deleteNotification('${n.id}')" title="Dismiss"><i class="fas fa-times"></i></button>
                            </div>`).join('')}
                        </div>
                    </div>`;
        document.getElementById('contentArea').innerHTML = html;
        document.getElementById('notificationCount').style.display = 'none';

        const container = document.getElementById('notifContainer');
        if (container) {
            let startX = 0,
                currentX = 0,
                activeNotif = null;
            container.addEventListener('touchstart', e => {
                const item = e.target.closest('.notification-item');
                if (!item) return;
                activeNotif = item;
                startX = e.touches[0].clientX;
                item.style.transition = 'none';
            }, { passive: true });
            container.addEventListener('touchmove', e => {
                if (!activeNotif) return;
                currentX = e.touches[0].clientX;
                const deltaX = currentX - startX;
                if (deltaX < 0) activeNotif.style.transform = `translateX(${deltaX}px)`;
            }, { passive: true });
            container.addEventListener('touchend', e => {
                if (!activeNotif) return;
                activeNotif.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                if (currentX - startX < -100) {
                    activeNotif.classList.add('swiped-left');
                    const id = activeNotif.getAttribute('data-id');
                    setTimeout(() => deleteNotification(id), 300);
                } else {
                    activeNotif.style.transform = 'translateX(0px)';
                }
                activeNotif = null;
            });
        }
    }

    async function updateNotificationCount() {
        if (!currentUser) return;
        const badge = document.getElementById('notificationCount');
        const snap = await notificationsRef.get();
        let notifs = snap.docs.map(d => d.data());

        if (userRole === 'admin') notifs = notifs.filter(n => n.targetId === 'admin' || n.targetId === 'all');
        else notifs = notifs.filter(n => n.targetId === currentUser.employeeId || n.targetId === 'all');

        const count = notifs.length;
        badge.style.display = count > 0 ? 'inline' : 'none';
        badge.textContent = count > 99 ? '99+' : count;

        // --- APP BADGING API ADDED HERE ---
        if ('setAppBadge' in navigator) {
            try {
                if (count > 0) {
                    navigator.setAppBadge(count);
                } else {
                    navigator.clearAppBadge();
                }
            } catch (error) {
                console.error("App Badge error:", error);
            }
        }
    }

    function showToast(msg, type = 'success') {
        const t = document.createElement('div');
        t.className = 'notification-toast';
        t.style.background = type === 'error' ? 'var(--danger)' : type === 'warning' ? 'var(--warning)' :
            'var(--success)';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }

    function showModalError(title, msg) {
        document.getElementById('modalContent').innerHTML = `
                    <div style="text-align:center;">
                        <i class="fas fa-exclamation-triangle text-danger" style="font-size:48px; margin-bottom:16px;"></i>
                        <h3 style="margin-bottom:8px;">${title}</h3>
                        <p class="text-muted" style="margin-bottom:24px;">${msg}</p>
                        <button class="btn btn-outline" onclick="closeModal()">Close</button>
                    </div>
                `;
        document.getElementById('modal').classList.add('active');
    }

    // ============================================================
    //  INIT
    // ============================================================
    (async function init() {
        if (localStorage.getItem('optenix_darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeColorMeta').setAttribute('content', '#121212');
        }

        const saved = localStorage.getItem('optenix_currentUser');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                auth.onAuthStateChanged((user) => {
                    if (user && parsed.uid === user.uid) {
                        currentUser = parsed;
                        userRole = currentUser.role;
                        isTeamLeader = (currentUser.designation || '').toLowerCase() === 'team leader';

                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('dashboardScreen').classList.remove('hidden');

                        appLoadTime = Date.now();
                        setupPushNotifications(); // Requesting FCM Token
                        setupLiveListeners();
                        initializeDashboard();
                        startIpMonitor();
                        hideLoadingOverlay();
                    } else {
                        localStorage.removeItem('optenix_currentUser');
                        hideLoadingOverlay();
                    }
                });
            } catch (_) {
                localStorage.removeItem('optenix_currentUser');
                hideLoadingOverlay();
            }
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            hideLoadingOverlay();
        }
    })();

    // Updated SW Registration to point to the new Messaging SW name
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./firebase-messaging-sw.js').catch(err =>
            console.error('Service Worker Registration Error:', err)));
    }
</script>
</body>
